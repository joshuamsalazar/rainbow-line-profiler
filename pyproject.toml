[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rainbower"
version = "0.1.0"
description = "A scientific Streamlit app to analyze color profiles along a user-drawn line."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "scipy>=1.11",
    "streamlit-drawable-canvas",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1.0",
]