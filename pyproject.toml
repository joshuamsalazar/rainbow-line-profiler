[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rainbower"
version = "0.1.0"
description = "A scientific Streamlit app to analyze color profiles along a user-drawn line."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30",
    "numpy>=1.26",
    "pandas>=2.1",
    "pillow>=10.0",
    "plotly>=5.0",
    "scikit-image>=0.22",
    "streamlit-drawable-canvas",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.setuptools.packages.find]
include = ["src*"]