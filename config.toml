[app]
title = "Rainbow Line Profiler"
default_line_width = 5
use_local_demo = true

[demo]
path = "assets/demo/Ring-billed_gull_and_a_rainbow_(52910).jpg"
label = "Local rainbow demo image"

[reference]
enabled = true
hue_range = [0.0, 0.75]
default_saturation = 0.6

[plots]
rgb_colors = ["red", "green", "blue"]
hue_color = "black"
sat_color = "magenta"