[workspace]
name = "rainbow-line-profiler"
version = "0.1.0"
description = "Scientific single-line rainbow profiler"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tasks]
run-app = "streamlit run app.py"
run-sandbox = "streamlit run streamlit_app.py"
run-test = "streamlit run simple_app.py"
test = "pytest"
lint = "ruff check ."
format = "ruff format ."

[dependencies]
python = "3.12.*"
pip = "*"
streamlit = "*"
numpy = "*"
pillow = "*"
plotly = "*"
scikit-image = "*"
requests = "*"
pytest = "*"
ruff = "*"

[pypi-dependencies]
streamlit-drawable-canvas = "*"