[workspace]
name = "rainbow-line-profiler"
version = "0.1.0"
description = "Scientific single-line rainbow profiler"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tasks]
run-app = "streamlit run app.py"
run-sandbox = "streamlit run streamlit_app.py"
run-test = "streamlit run src/simple_app.py"
test = "pytest"
lint = "ruff check ."
format = "ruff format ."
add-dep = "pixi add --pypi $1 && uv pip compile pyproject.toml -o requirements.txt"
notebook = "jupyter lab notebooks/line_profiler_minimal.ipynb"

[dependencies]
python = "3.12.*"
pip = "*"
streamlit = "*"
numpy = "*"
pandas = "*"
pillow = "*"
plotly = "*"
scikit-image = "*"
pytest = "*"
ruff = "*"
jupyter = ">=1.1.1,<2"

[pypi-dependencies]
streamlit-drawable-canvas = "*"
marimo = { version = ">=0.25.0", extras = ["sandbox"] }
marimo-jupyter-extension = ">=0.5.0, <0.6"
