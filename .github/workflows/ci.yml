name: Rainbow Line Profiler CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Pixi
      uses: prefix-dev/setup-pixi@v0

    - name: Install environment
      run: pixi install

    - name: Run linting
      run: pixi run lint

    - name: Run tests
      run: pixi run test

    - name: Smoke check app.py
      run: pixi run python -c "import ast; ast.parse(open('src/simple_app.py').read()); print('app.py parses successfully')"

    - name: Smoke check pipeline.py
      run: pixi run python -c "from src.pipeline import run_app_pipeline; print('pipeline.py imports successfully')"