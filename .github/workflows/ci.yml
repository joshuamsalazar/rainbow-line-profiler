name: Rainbow Line Profiler CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Pixi
      uses: prefix-dev/setup-pixi@v1.1.1
      with:
        python-version: "3.12"

    - name: Install environment
      run: pixi install

    - name: Run linting
      run: pixi run lint

    - name: Run tests
      run: pixi run test

    - name: Smoke check app.py
      run: python -c "import app; print('app.py imports successfully')"

    - name: Smoke check pipeline.py
      run: python -c "from src.pipeline import run_app_pipeline; print('pipeline.py imports successfully')"